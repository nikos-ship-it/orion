# Paste into Plesk → Websites & Domains → orionouzeri.gr →
# Apache & nginx Settings → "Additional nginx directives", then Apply.
#
# WHY THIS EXISTS: with Plesk's "Smart static files processing" enabled, nginx
# serves static files directly and never consults .htaccess — so the caching and
# security rules there silently do nothing. These directives are the nginx
# equivalent. Harmless to add even if Apache is doing the serving.
#
# This file is documentation. Nothing reads it automatically.

# index.html must win over the WordPress index.php still sitting in the docroot.
index index.html;

# ── Don't serve leftovers ────────────────────────────────────────
# If PHP handling is ever removed, .php would be served as plain text and
# wp-config.php would leak database credentials. Deleting the old WordPress
# files is the real fix; this is a safety net.
location ~ ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)$ {
    deny all;
}

# README.md ships with the site but is not for visitors.
location ~* \.(md|yml|yaml)$ {
    deny all;
}

location ~ /\.git {
    deny all;
}

# ── Caching ──────────────────────────────────────────────────────
# Filenames are stable. If you replace a photo, rename it or add ?v=2.
location ~* \.(jpg|jpeg|png|webp|mp4|woff2|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public";
}

# HTML must never be cached hard, or edits take a month to appear.
location ~* \.html?$ {
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# ── Security headers ─────────────────────────────────────────────
# always: so they are sent on error responses (404) too.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SAMEORIGIN, not DENY: the Visit section embeds map.html in an iframe.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# ── 404 ──────────────────────────────────────────────────────────
error_page 404 /404.html;
