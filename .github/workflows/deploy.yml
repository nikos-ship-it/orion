name: Deploy to top.host

# Manual only, on purpose. Before the first run, confirm in the hosting panel
# where the document root of menu.orionouzeri.gr points — if it sits inside the
# folder named in FTP_SERVER_DIR, add it to the exclude list below.
#
# Once a manual run has succeeded, uncomment the push trigger to deploy on merge.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  # Two deploys writing over FTP at once corrupts the sync state file.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel main domain is usually /public_html/. Set the FTP_SERVER_DIR
          # secret if yours differs; the trailing slash matters.
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          protocol: ftps
          # Never wipe the destination. The action only removes files it
          # uploaded on a previous run, so pre-existing files it has never
          # touched — including anything belonging to a subdomain — are left
          # alone. Do not set this to true.
          dangerous-clean-slate: false
          # Replaces the action's defaults, so every exclusion must be listed.
          # .htaccess is deliberately NOT excluded: production needs it.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            design-source/**
            README.md
            .ftp-deploy-sync-state.json
