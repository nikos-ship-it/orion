<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion Ouzeri — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  /* Palette: bone land, desaturated Aegean water, sage greenery. Lower
     saturation than a stock map reads as more considered — the pin is the only
     saturated thing on screen, so the eye goes straight to it. */
  html,body{margin:0;height:100%;background:#F4F1EA;font-family:Jost,"Helvetica Neue",Helvetica,sans-serif}
  #map{position:absolute;inset:0;background:#F4F1EA}
  .leaflet-container{background:#F4F1EA;font-family:Jost,sans-serif}
  .om-fallback .leaflet-tile-pane{filter:saturate(.55) sepia(.16) brightness(1.04) contrast(.94)}
  .leaflet-control-attribution{background:rgba(244,241,234,.9)!important;color:#8C8579!important;font-size:10px!important;padding:3px 8px!important;border-radius:999px 0 0 0}
  .leaflet-control-attribution a{color:#0E3550!important;text-decoration:none}

  /* Pin: the Orion mark on a white disc, with a soft halo ring pulsing out.
     The container is 0×0 and its children hang off it, so pointer events are
     switched off there and back on for the link alone — otherwise the invisible
     box would eat drags meant for the map. */
  .om-pin{position:relative;pointer-events:none}
  .om-pin .om-link{display:block;pointer-events:auto;cursor:pointer;text-decoration:none}
  .om-pin .om-link:focus-visible{outline:none}
  .om-pin .om-link:focus-visible .om-disc{box-shadow:0 0 0 3px #EFA92B,0 12px 30px rgba(14,53,80,.24)}
  .om-pin .om-disc,.om-pin .om-label{transition:transform .35s cubic-bezier(.22,.61,.24,1),background .35s ease}
  .om-pin .om-link:hover .om-disc{transform:scale(1.06)}
  .om-pin .om-link:hover .om-label{background:#EFA92B;color:#16232D}
  .om-pin .om-disc{
    position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:#FFFFFF;
    box-shadow:0 2px 6px rgba(14,53,80,.18),0 12px 30px rgba(14,53,80,.24);
    display:flex;align-items:center;justify-content:center;
  }
  .om-pin .om-disc img{width:40px;height:auto;display:block}
  /* Stem connecting the disc to the exact coordinate. */
  .om-pin .om-stem{
    position:absolute;left:50%;top:50%;width:1px;height:18px;margin:19px 0 0 -.5px;
    background:linear-gradient(180deg,rgba(14,53,80,.55),rgba(14,53,80,0));
  }
  .om-pin .om-dot{
    position:absolute;left:50%;top:50%;width:7px;height:7px;margin:33px 0 0 -3.5px;
    border-radius:50%;background:#0E3550;
  }
  .om-pin .om-halo{
    position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;border:1px solid rgba(239,169,43,.85);
    animation:om-pulse 3.2s cubic-bezier(.22,.61,.24,1) infinite;
  }
  @keyframes om-pulse{0%{transform:scale(.8);opacity:.85}70%{transform:scale(1.85);opacity:0}100%{opacity:0}}

  .om-label{
    position:absolute;left:50%;top:44px;transform:translateX(-50%);white-space:nowrap;
    background:#0E3550;color:#FAF7F0;padding:8px 16px;border-radius:999px;
    font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    box-shadow:0 8px 24px rgba(14,53,80,.28);
  }

  .om-ui{position:absolute;z-index:600;display:flex;gap:8px}
  .om-zoom{right:14px;top:14px;flex-direction:column}
  .om-zoom button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);color:#0E3550;border:1px solid rgba(199,220,228,.9);border-radius:50%;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(14,53,80,.1);transition:background .3s ease,color .3s ease}
  .om-zoom button:hover{background:#0E3550;color:#FAF7F0;border-color:#0E3550}

</style>
</head>
<body>
<div id="map"></div>
<div class="om-ui om-zoom">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">–</button>
</div>
<script>
  var ORION = [35.31042466, 25.40176382];  // confirmed: Plus Code 8C62+5P Hersonissos
  var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  var ATTR = '© OpenStreetMap contributors';
  var GMAPS_HREF = 'https://www.google.com/maps/search/?api=1&query=' + ORION[0] + '%2C' + ORION[1];

  // If the Leaflet CDN is blocked or fails, `L` never exists and the whole map
  // would be a blank frame. Show a real fallback (mark + address + a way there)
  // instead of a void, and stop before the code that assumes L.
  if (typeof L === 'undefined') {
    document.getElementById('map').innerHTML =
      '<a href="' + GMAPS_HREF + '" target="_blank" rel="noopener" ' +
      'style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
      'justify-content:center;gap:16px;text-align:center;color:#0E3550;text-decoration:none;padding:24px">' +
      '<span style="display:grid;place-items:center;width:68px;height:68px;border-radius:50%;' +
      'background:#fff;box-shadow:0 8px 24px rgba(14,53,80,.16)">' +
      '<img src="assets/orion-logo.png" alt="" width="44"></span>' +
      '<span style="font-size:13px;letter-spacing:.04em;line-height:1.7">' +
      '<strong style="display:block;font-size:15px;font-weight:500">Kallergi 8, Hersonissos</strong>' +
      'Open in Google Maps</span></a>';
    throw new Error('Leaflet unavailable — showing static map fallback.');
  }

  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    var l = (mx + mn) / 2, s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d !== 0) {
      if (mx === r) h = 60 * (((g - b) / d) % 6);
      else if (mx === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
    }
    if (h < 0) h += 360;
    return [h, s, l];
  }
  function hsl2rgb(h, s, l) {
    var c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)), m = l - c / 2, r, g, b;
    if (hp < 1) { r = c; g = x; b = 0; } else if (hp < 2) { r = x; g = c; b = 0; }
    else if (hp < 3) { r = 0; g = c; b = x; } else if (hp < 4) { r = 0; g = x; b = c; }
    else if (hp < 5) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }

  // Restrained Aegean palette. Everything is pulled toward low saturation and
  // high lightness so the map reads as a quiet backdrop; the amber pin is then
  // the only saturated element and needs no extra emphasis.
  function recolor(data) {
    for (var i = 0; i < data.length; i += 4) {
      if (data[i + 3] === 0) continue;
      var hsl = rgb2hsl(data[i], data[i + 1], data[i + 2]);
      var h = hsl[0], s = hsl[1], l = hsl[2], out;
      if (s > 0.07 && h >= 168 && h <= 248) {           // sea: deep, desaturated Aegean
        out = hsl2rgb(201, 0.32, Math.min(0.72, 0.34 + l * 0.36));
      } else if (s > 0.06 && h >= 62 && h < 168) {       // parks, trees: sage
        out = hsl2rgb(88, 0.16, Math.min(0.87, 0.62 + l * 0.26));
      } else if (l > 0.9) {                              // paper, road fill: warm bone
        out = hsl2rgb(42, 0.20, Math.min(0.972, 0.90 + l * 0.08));
      } else if (l > 0.55) {                             // building fills: soft stone
        out = hsl2rgb(38, 0.12, Math.min(0.93, l * 1.06));
      } else {                                           // roads, labels: muted slate
        out = hsl2rgb(210, Math.min(0.16, s * 0.35 + 0.06), Math.min(0.62, l * 1.18 + 0.06));
      }
      data[i] = out[0]; data[i + 1] = out[1]; data[i + 2] = out[2];
    }
  }

  var Med = L.GridLayer.extend({
    createTile: function (coords, done) {
      var size = this.getTileSize();
      var canvas = L.DomUtil.create('canvas');
      canvas.width = size.x; canvas.height = size.y;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size.x, size.y);
        try {
          var d = ctx.getImageData(0, 0, size.x, size.y);
          recolor(d.data);
          ctx.putImageData(d, 0, 0);
          canvas.dataset.recolored = '1';
        } catch (e) {
          document.body.classList.add('om-fallback');
        }
        done(null, canvas);
      };
      img.onerror = function () { done(null, canvas); };
      img.src = L.Util.template(TILE_URL, L.extend({ r: '', s: 'a' }, coords));
      return canvas;
    }
  });

  var map = L.map('map', {
    center: ORION, zoom: 17, minZoom: 12, maxZoom: 18,
    zoomControl: false, scrollWheelZoom: false
  });
  new Med({ maxZoom: 19, attribution: ATTR, updateWhenIdle: false }).addTo(map);

  // Tapping the pin or its label opens the real Google Maps entry, in a new tab.
  // target="_top" would replace the whole site; this page is in an iframe, so the
  // link has to be explicit about opening a new tab rather than navigating the
  // frame it lives in.
  var GMAPS = 'https://www.google.com/maps/search/?api=1&query=' + ORION[0] + '%2C' + ORION[1];

  L.marker(ORION, {
    icon: L.divIcon({
      className: 'om-pin',
      html: '<span class="om-halo"></span>' +
            '<span class="om-stem"></span><span class="om-dot"></span>' +
            '<a class="om-link" href="' + GMAPS + '" target="_blank" rel="noopener"' +
              ' aria-label="Open Orion Ouzeri in Google Maps">' +
              '<span class="om-disc"><img src="assets/orion-logo.png" alt="Orion Ouzeri"></span>' +
              '<span class="om-label">Orion Ouzeri</span>' +
            '</a>',
      iconSize: [0, 0]
    }),
    keyboard: false, interactive: false, title: 'Orion Ouzeri — open in Google Maps'
  }).addTo(map);

  document.getElementById('zin').onclick = function () { map.zoomIn(); };
  document.getElementById('zout').onclick = function () { map.zoomOut(); };

  // scrollWheelZoom stays false for the life of the map: the page must keep
  // scrolling when the pointer crosses it. Dragging to pan and the +/- buttons
  // are the ways to move around, so nothing needs an unlock step.

  function recenter() { map.setView(ORION, map.getZoom(), { animate: false }); }
  window.addEventListener('resize', function () { map.invalidateSize(); recenter(); });
  setTimeout(function () { map.invalidateSize(); recenter(); }, 300);
</script>
</body>
</html>
